<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <script>try{var t=localStorage.getItem('praxis_hero_hq_theme');if(t==='light')t='classic';if(t==='dark')t='dark-tech';if(!['classic','light-tech','dark-tech'].includes(t))t='dark-tech';document.documentElement.dataset.theme=t;document.documentElement.classList.toggle('dark',t==='dark-tech')}catch{document.documentElement.dataset.theme='dark-tech';document.documentElement.classList.add('dark')}</script>
    <meta charset="utf-8" />
    <title>Praxis Hero HQ | Gestão Tática & RH de Super-Heróis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Praxis Hero HQ - Plataforma corporativa de gestão de heróis, operações táticas, ativos e inteligência de risco governada por metadados da Plataforma Praxis."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&family=Material+Symbols+Rounded:FILL@0..1&family=Material+Symbols+Sharp:FILL@0..1&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root>
      <div role="status" style="min-height:100vh;display:grid;place-content:center;gap:12px;text-align:center;background:var(--background);color:var(--foreground);font-family:var(--font-sans)">
        <strong style="font-size:22px">Praxis Hero HQ</strong>
        <span style="color:var(--muted-foreground)">Carregando o workspace…</span>
      </div>
    </app-root>
  </body>
</html>
