name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate Firebase Hosting credential
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRAXIS_HERO_HQ }}
        run: |
          node <<'NODE'
          try {
            const credential = JSON.parse(process.env.FIREBASE_SECRET || 'null');
            if (credential?.type !== 'service_account' ||
                credential.project_id !== 'praxis-hero-hq' ||
                credential.client_email !== 'github-hero-hosting@praxis-hero-hq.iam.gserviceaccount.com') {
              throw new Error();
            }
            require('node:crypto').createPrivateKey(credential.private_key);
          } catch {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT_PRAXIS_HERO_HQ is missing or invalid for the dedicated Hero Hosting account.');
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRAXIS_HERO_HQ }}'
          channelId: live
          projectId: praxis-hero-hq
          firebaseToolsVersion: '15.34.0'
